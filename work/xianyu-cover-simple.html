<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏王对战计数器 · 简洁封面</title>
<style>
*{box-sizing:border-box}
html,body{width:1080px;height:1080px;margin:0;overflow:hidden}
body{font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif;color:#f4f5fa;background:#090e19}
.cover{position:relative;width:1080px;height:1080px;overflow:hidden;background:radial-gradient(ellipse 600px 410px at 50% 56%,#25344c 0%,#121b2b 47%,transparent 82%),linear-gradient(145deg,#080d18,#101929 60%,#080d17)}
.cover:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#ef6472 0%,#dcb570 50%,#69c9f1 100%)}
.top{position:absolute;top:82px;left:76px;right:76px}
.kicker{color:#d7bc80;font-size:22px;font-weight:650;letter-spacing:5px}
h1{margin:26px 0 16px;font-size:77px;line-height:1.12;letter-spacing:1px;font-weight:900;white-space:nowrap}
h1 em{font-style:normal;color:#f6d68d}
.sub{margin:0;color:#bcc9dc;font-size:30px;font-weight:600;letter-spacing:2px}
.screen{position:absolute;top:343px;left:66px;width:948px;height:427px;overflow:hidden;border:2px solid #bca271;border-radius:10px;background:#080d19;box-shadow:0 26px 55px #000a,0 0 35px #b18a4d26}
.screen img{display:block;width:100%;height:100%;object-fit:fill}
.rule{position:absolute;left:76px;right:76px;top:832px;height:1px;background:linear-gradient(90deg,transparent,#d1af737a 12%,#d1af737a 88%,transparent)}
.features{position:absolute;top:865px;left:70px;right:70px;text-align:center;font-size:31px;font-weight:760;letter-spacing:1px;white-space:nowrap}
.features i{font-style:normal;color:#d4b77c;margin:0 21px;font-weight:400}
.local{position:absolute;top:947px;left:0;right:0;text-align:center;color:#d1d9e5;font-size:24px;letter-spacing:3px}
.local b{color:#f2d087}
</style>
</head>
<body>
<div class="cover">
  <div class="top">
    <div class="kicker">纯本地 · 手机横屏</div>
    <h1>游戏王<em>对战计数器</em></h1>
    <p class="sub">双人生命值，一屏看清</p>
  </div>
  <div class="screen"><img src="../outputs/手机横屏预览.png" alt="游戏王对战计数器的双人横屏界面"></div>
  <div class="rule"></div>
  <div class="features">快捷调整 LP<i>·</i>骰子与硬币<i>·</i>先手判定</div>
  <div class="local">单个 HTML 文件 <b>· 无需联网</b></div>
</div>
</body>
</html>
