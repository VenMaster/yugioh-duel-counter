/* 初代决斗盘风格的金属 LP 计数牌 */
.lp-wrap{padding:7px 0 10px}
.lp-button{margin:0 auto;min-height:0;display:flex;justify-content:center;align-items:center}
.lp-plaque{position:relative;display:block;width:min(76%,350px);height:clamp(112px,17vh,165px);text-align:left;overflow:hidden;background:linear-gradient(162deg,#202127 0%,#424147 22%,#6f7075 43%,#aaa8a8 69%,#838284 83%,#363538 100%);border:7px ridge #9a7d60;outline:2px solid #17181e;box-shadow:inset 0 0 0 2px #343137,inset 0 0 0 5px #c4bdb0,inset 0 0 24px #15111599,0 7px 0 #272124,0 12px 18px #0009;transform:perspective(700px) rotateX(3deg) rotateY(-3deg)}
.lp-plaque:before{content:'';position:absolute;inset:5px;border:2px solid #ffffff25;box-shadow:inset 0 2px 6px #15141988;pointer-events:none}
.lp-plaque:after{content:'';position:absolute;left:0;right:0;top:0;height:43%;background:linear-gradient(#ffffff2a,transparent);pointer-events:none}
.plaque-label{position:absolute;top:7%;left:11%;font:italic 500 clamp(24px,3.2vw,39px) Georgia,"Times New Roman",serif;color:#19191e;letter-spacing:2px;text-shadow:1px 1px #e0d7c9,-1px -1px #0d0d11,2px 3px 3px #0007;z-index:1}
.plaque-value{position:absolute;left:10%;right:7%;bottom:5%;display:block;white-space:nowrap;text-align:center;font:italic 500 clamp(53px,7vw,88px)/.96 Georgia,"Times New Roman",serif;letter-spacing:.035em;color:#aa6c2d;background:linear-gradient(180deg,#ffe1a1 0%,#d4a15a 29%,#8a491e 59%,#e8b878 78%,#704224 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(2px 2px 0 #352014) drop-shadow(3px 4px 2px #17120eaf);z-index:1;font-variant-numeric:lining-nums tabular-nums}
.plaque-value.long{font-size:clamp(35px,4.7vw,58px);bottom:10%}
.lp-subtitle{margin-top:13px}.energy{margin-top:8px}
/* 真正的六面体：面向镜头的是最终点数，转动时可见侧面 */
.tool-stage{perspective:850px;overflow:hidden;gap:26px}
.die-scene{width:70px;height:78px;flex:0 0 70px;display:grid;place-items:center;perspective:360px;filter:drop-shadow(5px 14px 5px #0008)}
.die-cube{--x:0deg;--y:0deg;position:relative;width:62px;height:62px;transform-style:preserve-3d;transform:rotateX(var(--x)) rotateY(var(--y));will-change:transform}
.die-cube.rolling{animation:die-tumble 1.2s cubic-bezier(.16,.72,.18,1) both}
.die-face{position:absolute;inset:0;border:2px solid #d5be91;border-radius:11px;background:linear-gradient(145deg,#fff9ea 4%,#e6d7b7 49%,#b6a07b 100%);box-shadow:inset 3px 3px 9px #fff8,inset -4px -5px 9px #66533d59;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;backface-visibility:visible}
.die-face.front{transform:translateZ(31px)}.die-face.back{transform:rotateY(180deg) translateZ(31px)}.die-face.right{transform:rotateY(90deg) translateZ(31px)}.die-face.left{transform:rotateY(-90deg) translateZ(31px)}.die-face.top{transform:rotateX(90deg) translateZ(31px)}.die-face.bottom{transform:rotateX(-90deg) translateZ(31px)}
.pip{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 68% 70%,#514234 5%,#181722 70%);align-self:center;justify-self:center;box-shadow:inset 1px 2px 2px #080910,0 1px 1px #fff9}
@keyframes die-tumble{0%{transform:translateY(10px) rotateX(calc(var(--x) - 700deg)) rotateY(calc(var(--y) + 640deg)) scale(.82)}32%{transform:translateY(-27px) rotateX(calc(var(--x) - 450deg)) rotateY(calc(var(--y) + 420deg)) scale(1.14)}61%{transform:translateY(1px) rotateX(calc(var(--x) - 170deg)) rotateY(calc(var(--y) + 185deg)) scale(.93)}78%{transform:translateY(-10px) rotateX(calc(var(--x) - 70deg)) rotateY(calc(var(--y) + 75deg)) scale(1.04)}100%{transform:translateY(0) rotateX(var(--x)) rotateY(var(--y)) scale(1)}}

<script>
'use strict';
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
const STORAGE_KEY='yugioh-duel-terminal-v1',LIMIT=999999,MAX_HISTORY=200;
const defaultState=()=>({players:[{name:'玩家一',lp:8000},{name:'玩家二',lp:8000}],initial:8000,first:null,history:[],sound:true});
let state=defaultState(),modes=[-1,-1],frames=[0,0],displayed=[8000,8000],amount='',operation=-1,activePlayer=0,tool='dice',diceCount=1,coinCount=1,busy=false,generation=0,pendingTimer=0,toastTimer=0,audioContext,lpAudioBus,lpBuffersPromise,lifeSoundToken=0;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function validPlayer(p){return p&&typeof p.name==='string'&&p.name.length<=20&&Number.isInteger(p.lp)&&p.lp>=0&&p.lp<=LIMIT;}
function validSnapshot(s){return s&&Array.isArray(s.players)&&s.players.length===2&&s.players.every(validPlayer)&&(s.first===null||s.first===0||s.first===1);}
function validState(s){return s&&validSnapshot(s)&&Number.isInteger(s.initial)&&s.initial>0&&s.initial<=LIMIT&&typeof s.sound==='boolean'&&Array.isArray(s.history)&&s.history.length<=MAX_HISTORY&&s.history.every(h=>h&&typeof h.text==='string'&&typeof h.time==='string'&&validSnapshot(h.before));}
function stripPlayers(players){return players.map(p=>({name:p.name,lp:p.lp}));}
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validState(stored)){
  if(stored.players.some(p=>'counter' in p||'counterGroups' in p))try{localStorage.setItem(STORAGE_KEY+'-legacy-backup',JSON.stringify(stored));}catch(e){}
  state={players:stripPlayers(stored.players),initial:stored.initial,first:stored.first,sound:stored.sound,history:stored.history.filter(h=>!/^进入第 \d+ 回合$/.test(h.text)&&!h.text.includes('指示物')).map(h=>({...h,before:{players:stripPlayers(h.before.players),first:h.before.first}}))};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}}catch(e){}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('#storageStatus').textContent='已本地保存';}catch(e){$('#storageStatus').textContent='当前会话 · 未保存';}}
function snapshot(){return JSON.parse(JSON.stringify({players:state.players,first:state.first}));}
function record(text,before,type='normal'){state.history.unshift({text,before,time:new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}),type});state.history=state.history.slice(0,MAX_HISTORY);save();renderMeta();$('#announcement').textContent=text;}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2600);}
function getAudioContext(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;audioContext=audioContext||new Audio();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext;}
function tone(ctx,output,at,hz,endHz,length,level,wave='triangle'){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(hz,at);osc.frequency.exponentialRampToValueAtTime(Math.max(30,endHz),at+length);gain.gain.setValueAtTime(.0001,at);gain.gain.linearRampToValueAtTime(level,at+.006);gain.gain.exponentialRampToValueAtTime(.0001,at+length);osc.connect(gain);gain.connect(output);osc.onended=()=>{osc.disconnect();gain.disconnect();};osc.start(at);osc.stop(at+length+.01);}
function stopLifeSound(){lifeSoundToken++;if(!lpAudioBus||!audioContext)return;const now=audioContext.currentTime;lpAudioBus.gain.cancelScheduledValues(now);lpAudioBus.gain.setTargetAtTime(0,now,.012);lpAudioBus=null;}
function renderSoundToggle(){const button=$('#soundToggle'),on=state.sound;button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'关闭决斗音效':'开启决斗音效');button.title=on?'关闭决斗音效':'开启决斗音效';$('use',button).setAttribute('href',on?'#i-sound-on':'#i-sound-off');}
function sound(kind){if(navigator.vibrate)navigator.vibrate(20);if(!state.sound)return;try{const ctx=getAudioContext();if(!ctx)return;const t=ctx.currentTime+.01;tone(ctx,ctx.destination,t,kind==='damage'?860:1050,kind==='damage'?650:1200,.12,.045,'triangle');}catch(e){}}
function prepareLifeBuffers(){
  if(lpBuffersPromise)return lpBuffersPromise;
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return Promise.reject(new Error('AudioContext unavailable'));
  const decoder=audioContext=audioContext||new Audio();
  const data=JSON.parse($('#lpAudioSamples').textContent);
  const decode=base64=>{const binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return decoder.decodeAudioData(bytes.buffer);};
  lpBuffersPromise=Promise.all([decode(data.count),decode(data.zero),decode(data.start),decode(data.end)]).then(([count,zero,start,end])=>({count,zero,start,end}));
  return lpBuffersPromise;
}
function fallbackLifeSound(ctx,prev,next,seconds){const bus=ctx.createGain();bus.gain.value=.65;bus.connect(ctx.destination);lpAudioBus=bus;const count=Math.max(4,Math.min(8,Math.round(seconds/.1))),start=ctx.currentTime+.015;for(let n=0;n<count;n++){const at=start+n*(seconds-.08)/count,progress=n/(count-1),base=next<prev?1180-progress*300:800+progress*350;tone(ctx,bus,at,base,base*.8,.072,.105);tone(ctx,bus,at,base*2,base*1.7,.045,.018,'square');}tone(ctx,bus,start+seconds,next===0?360:900,next===0?75:510,next===0?.42:.25,.16,next===0?'sawtooth':'triangle');setTimeout(()=>{bus.disconnect();if(lpAudioBus===bus)lpAudioBus=null;},(seconds+.6)*1000);}
function playLifeSound(prev,next,animationMs){
  if(navigator.vibrate)navigator.vibrate(next===0?[35,25,60,25,90]:next<prev?[18,18,35]:18);
  stopLifeSound();
  if(!state.sound)return;
  const token=lifeSoundToken,seconds=Math.max(.46,animationMs/1000);
  try{const ctx=getAudioContext();if(!ctx)return;prepareLifeBuffers().then(({count,zero,end:finish})=>{
    if(token!==lifeSoundToken||!state.sound)return;
    const remaining=seconds,start=ctx.currentTime+.01,end=start+remaining;
    const bus=ctx.createGain();bus.gain.value=1;bus.connect(ctx.destination);lpAudioBus=bus;
    const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=count;source.loop=true;
    gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.9,start+.01);gain.gain.setValueAtTime(.9,Math.max(start+.01,end-.05));gain.gain.linearRampToValueAtTime(0,end);
    source.connect(gain);gain.connect(bus);source.onended=()=>{source.disconnect();gain.disconnect();};source.start(start);source.stop(end+.01);
    const ending=next===0?zero:finish,final=ctx.createBufferSource();final.buffer=ending;final.connect(bus);final.onended=()=>final.disconnect();final.start(end);
    setTimeout(()=>{bus.disconnect();if(lpAudioBus===bus)lpAudioBus=null;},(remaining+ending.duration+.2)*1000);
  }).catch(()=>{if(token===lifeSoundToken&&state.sound)fallbackLifeSound(ctx,prev,next,seconds);});}catch(e){}
}
function playDuelStartSound(){
  stopLifeSound();if(!state.sound)return;
  const token=lifeSoundToken;
  try{const ctx=getAudioContext();if(!ctx)return;prepareLifeBuffers().then(({start})=>{
    if(token!==lifeSoundToken||!state.sound)return;
    const bus=ctx.createGain(),source=ctx.createBufferSource();bus.gain.value=1;bus.connect(ctx.destination);lpAudioBus=bus;
    source.buffer=start;source.connect(bus);source.onended=()=>{source.disconnect();bus.disconnect();if(lpAudioBus===bus)lpAudioBus=null;};source.start(ctx.currentTime+.01);
  }).catch(()=>{if(token===lifeSoundToken&&state.sound)sound('heal');});}catch(e){}
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function drawLP(i,val){displayed[i]=val;const value=$('#lp'+i),text=$('#lpValue'+i),size=String(val).length>5?83:String(val).length===5?100:120;text.textContent=val;text.setAttribute('font-size',size);value.classList.toggle('long',String(val).length>4);$('#lpButton'+i).setAttribute('aria-label',state.players[i].name+'生命值 '+val+'，点击调整');$('#lpText'+i).textContent=val;}
function playerHTML(i){return `<article class="player ${i?'blue':''}" id="player${i}"><div class="player-head"><div class="identity"><span class="player-index">0${i+1}</span><span class="name" id="name${i}"></span></div><span class="first-badge" id="first${i}" hidden>先手</span></div><div class="lp-wrap"><button class="lp-button" id="lpButton${i}" data-custom="${i}"><span class="lp-plaque"><span class="plaque-label">LP</span><span class="plaque-value" id="lp${i}"><svg viewBox="0 0 420 135" preserveAspectRatio="xMaxYMid meet" aria-hidden="true"><defs><linearGradient id="lpGrad${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff5d4"/><stop offset="28%" stop-color="#f1d090"/><stop offset="67%" stop-color="#c58841"/><stop offset="100%" stop-color="#f3d498"/></linearGradient></defs><text id="lpValue${i}" x="409" y="111" text-anchor="end" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="120" fill="url(#lpGrad${i})" stroke="#8e5e32" stroke-width="0.7" paint-order="stroke">8000</text></svg></span></span><span class="sr-only" id="lpText${i}">8000</span></button><div class="lp-subtitle" id="lpSubtitle${i}">点击生命值 · 自定义调整</div><span class="delta" id="delta${i}" aria-hidden="true"></span></div><div class="quick-area"><div class="mode-line"><div class="mode"><button data-player="${i}" data-mode="-1" class="active">− 扣减</button><button data-player="${i}" data-mode="1">+ 回复</button></div><span class="quick-caption">快捷调整 LP</span></div><div class="quick-buttons" id="quick${i}">${[100,500,1000].map(n=>`<button data-quick="${n}" data-player="${i}">− ${n}</button>`).join('')}</div><div class="secondary-buttons"><button class="custom-btn" data-custom="${i}">自定义数值</button><button class="half-btn" data-half="${i}">生命值减半</button></div></div></article>`;}
$('.arena').insertAdjacentHTML('beforeend',playerHTML(0)+playerHTML(1));
function renderMeta(){
  state.players.forEach((p,i)=>{
    $('#name'+i).textContent=p.name;$('#first'+i).hidden=state.first!==i;
    $('#lpSubtitle'+i).textContent=p.lp===0?'生命值归零':'点击生命值 · 自定义调整';$('#lpSubtitle'+i).classList.toggle('zero-note',p.lp===0);
  });
  $('#undo').disabled=state.history.length===0;
  $('#lastEvent').textContent=state.history.length?state.history[0].text:`决斗准备就绪 · 双方初始 LP ${state.initial}`;
}
function renderAll(){state.players.forEach((p,i)=>{cancelAnimationFrame(frames[i]);drawLP(i,p.lp)});renderMeta();renderSoundToggle();}
function changeLP(i,next,label){next=Math.max(0,Math.min(LIMIT,next));const p=state.players[i],prev=p.lp;if(next===prev){toast('生命值未发生变化');return;}const before=snapshot();p.lp=next;record(`${p.name} ${label} · ${prev} → ${next} LP`,before,next<prev?'damage':'heal');const duration=animateLP(i,prev,next);playLifeSound(prev,next,duration);}
function animateLP(i,prev,next){cancelAnimationFrame(frames[i]);const start=performance.now(),from=displayed[i],duration=reduced()?0:Math.min(1100,Math.max(650,540+Math.abs(next-prev)/14));const tick=t=>{const progress=duration===0?1:Math.min((t-start)/duration,1);drawLP(i,Math.round(from+(next-from)*(1-Math.pow(1-progress,3))));if(progress<1)frames[i]=requestAnimationFrame(tick);};frames[i]=requestAnimationFrame(tick);const panel=$('#player'+i),delta=$('#delta'+i);panel.classList.remove('hit','recover');delta.classList.remove('show');void panel.offsetWidth;panel.classList.add(next<prev?'hit':'recover');delta.textContent=(next<prev?'− ':'+ ')+Math.abs(next-prev);delta.classList.toggle('heal',next>prev);delta.classList.add('show');return duration;}
function setMode(i,mode){modes[i]=mode;$$(`[data-mode][data-player="${i}"]`).forEach(b=>b.classList.toggle('active',Number(b.dataset.mode)===mode));$('#quick'+i).classList.toggle('heal',mode===1);$$(`[data-quick][data-player="${i}"]`).forEach(b=>b.textContent=(mode===1?'+ ':'− ')+b.dataset.quick);}
let lastFocus;
function openModal(title,html){clearTimeout(pendingTimer);generation++;busy=false;if(!$('#modal').open)lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){clearTimeout(pendingTimer);generation++;busy=false;$('#modal').close();if(lastFocus?.isConnected)lastFocus.focus();}
$('#closeModal').onclick=closeModal;$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function keypadModal(i){activePlayer=i;amount='';operation=modes[i];openModal(state.players[i].name+' · 调整生命值',`<div class="key-layout"><div><p class="modal-sub">当前生命值 <strong>${state.players[i].lp} LP</strong><br>输入数值，再选择应用。</p><div class="operation-tabs"><button data-op="-1">扣减</button><button data-op="1">回复</button><button data-op="0">设为</button></div><div class="amount-screen"><small id="amountLabel">调整数值</small><div class="amount-value" id="amountValue">0</div><div class="preview-value" id="previewValue"></div></div><p class="modal-sub" style="margin:0">最多 999999 LP<br>扣减最低到 0，可撤销误操作。</p></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','清空','0','⌫'].map(k=>`<button data-key="${k}" ${k==='⌫'?'aria-label="删除最后一位"':''}>${k}</button>`).join('')}<button class="apply" id="applyAmount">应用扣减</button></div></div>`);updateAmount();$$('[data-op]').forEach(b=>b.onclick=()=>{operation=Number(b.dataset.op);updateAmount()});$$('[data-key]').forEach(b=>b.onclick=()=>inputKey(b.dataset.key));$('#applyAmount').onclick=applyAmount;}
function inputKey(k){if(k==='清空')amount='';else if(k==='⌫')amount=amount.slice(0,-1);else if(amount.length<6)amount=(amount==='0'?'':amount)+k;updateAmount();}
function targetAmount(){const current=state.players[activePlayer].lp,n=Number(amount||0);return Math.max(0,Math.min(LIMIT,operation===0?n:current+operation*n));}
function updateAmount(){$('#amountValue').textContent=amount||'0';$('#amountLabel').textContent=operation===0?'设定生命值':'调整数值';$('#previewValue').textContent='调整后 '+targetAmount()+' LP';$$('[data-op]').forEach(b=>b.classList.toggle('active',Number(b.dataset.op)===operation));$('#applyAmount').textContent='应用'+(operation===-1?'扣减':operation===1?'回复':'设定');$('#applyAmount').disabled=amount===''||(operation!==0&&Number(amount)===0);}
function applyAmount(){if(!amount)return;const target=targetAmount(),n=Number(amount),i=activePlayer,op=operation;closeModal();changeLP(i,target,op===0?'设定生命值':(op<0?'扣减 ':'回复 ')+n);}
function undo(){if(!state.history.length)return;const h=state.history.shift();state.players=h.before.players;state.first=h.before.first;save();renderAll();toast('已撤销：'+h.text);sound('heal');}
function rand(max){if(globalThis.crypto?.getRandomValues){const buf=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(buf)}while(buf[0]>=limit);return buf[0]%max;}return Math.floor(Math.random()*max);}
const pipPositions={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
const faceNames=['front','back','right','left','top','bottom'],faceValues=[1,6,3,4,2,5],faceAngles={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]};
function facePips(n){return pipPositions[n].map(p=>`<span class="pip" style="grid-area:${Math.floor((p-1)/3)+1}/${(p-1)%3+1}"></span>`).join('');}
function diceHTML(n,rolling=false){const[x,y]=faceAngles[n];return `<div class="die-scene" role="img" aria-label="骰子 ${n} 点"><div class="die-cube ${rolling?'rolling':''}" style="--x:${x}deg;--y:${y}deg">${faceNames.map((f,i)=>`<div class="die-face ${f}">${facePips(faceValues[i])}</div>`).join('')}</div></div>`;}
function coinHTML(n,rolling=false){return `<div class="coin-scene" role="img" aria-label="硬币${n?'正面':'反面'}"><div class="coin-disc ${rolling?'rolling':''}" style="--face-y:${n?0:180}deg"><div class="coin-side front">正</div><div class="coin-side back">反</div></div></div>`;}
function openTool(t){tool=t;openModal('决斗工具',`<div class="tabs"><button data-tab="dice">掷骰子</button><button data-tab="coin">抛硬币</button><button data-tab="first">判定先手</button></div><div id="toolContent"></div>`);$$('[data-tab]').forEach(b=>b.onclick=()=>{if(!busy){tool=b.dataset.tab;renderTool()}});renderTool();}
function renderTool(){$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tool));if(tool==='first'){$('#toolContent').innerHTML=`<p class="modal-sub">随机抽选先手玩家。结果会在主界面标记，也可以手动选择。</p><div class="first-stage">${state.players.map((p,i)=>`<div class="first-choice ${state.first===i?'selected':''}" id="choice${i}"><small>PLAYER 0${i+1}</small>${esc(p.name)}</div>`).join('')}</div><div class="tool-result" id="toolResult">${state.first===null?'命运，即将揭晓':esc(state.players[state.first].name)+' · 先手'}</div><button class="gold-btn" id="rollTool">随机判定先手</button><div class="history-actions">${state.players.map((p,i)=>`<button data-pick="${i}">选择${esc(p.name)}</button>`).join('')}</div>`;$$('[data-pick]').forEach(b=>b.onclick=()=>pickFirst(Number(b.dataset.pick),false));}else{const isDice=tool==='dice',count=isDice?diceCount:coinCount;$('#toolContent').innerHTML=`<div class="stepper"><label style="margin:0">${isDice?'骰子':'硬币'}数量</label><button id="countDown" aria-label="减少数量" ${count===1?'disabled':''}>−</button><strong>${count}</strong><button id="countUp" aria-label="增加数量" ${count===3?'disabled':''}>+</button></div><div class="tool-stage" id="toolStage">${Array.from({length:count},()=>isDice?diceHTML(1):coinHTML(1)).join('')}</div><div class="tool-result" id="toolResult">${isDice?'六面骰 · 1 — 6':'正面 / 反面'}</div><button class="gold-btn" id="rollTool">${isDice?'掷出骰子':'抛出硬币'}</button>`;$('#countDown').onclick=()=>{if(isDice)diceCount--;else coinCount--;renderTool()};$('#countUp').onclick=()=>{if(isDice)diceCount++;else coinCount++;renderTool()};}$('#rollTool').onclick=rollTool;}
function lockTool(lock){busy=lock;$$('#modalBody button').forEach(b=>{if(lock)b.disabled=true;});$('#closeModal').disabled=false;}
function rollTool(){if(busy)return;const token=++generation;lockTool(true);sound('heal');$('#toolResult').textContent='效果处理中…';const duration=reduced()?80:tool==='first'?900:1250;if(tool==='first'){let flips=0;const tick=()=>{if(generation!==token)return;$$('.first-choice').forEach((el,i)=>el.classList.toggle('selected',i===flips%2));flips++;if(flips<8)pendingTimer=setTimeout(tick,85);};tick();pendingTimer=setTimeout(()=>{if(generation!==token)return;clearTimeout(pendingTimer);generation++;busy=false;pickFirst(rand(2),true);},duration);return;}
const isDice=tool==='dice',count=isDice?diceCount:coinCount,values=Array.from({length:count},()=>rand(isDice?6:2)+(isDice?1:0));$('#toolStage').innerHTML=values.map(v=>isDice?diceHTML(v,!reduced()):coinHTML(v,!reduced())).join('');pendingTimer=setTimeout(()=>{if(generation!==token)return;const before=snapshot();$('#toolStage').innerHTML=values.map(v=>isDice?diceHTML(v):coinHTML(v)).join('');const result=isDice?values.join(' + ')+(count>1?' = '+values.reduce((a,b)=>a+b,0):' 点'):values.map(v=>v?'正面':'反面').join(' · ');$('#toolResult').textContent=result;record((isDice?'掷骰子':'抛硬币')+' · '+result,before);busy=false;$$('#modalBody button').forEach(b=>b.disabled=false);$('#countDown').disabled=count===1;$('#countUp').disabled=count===3;},duration);}
function pickFirst(i,random){if(busy)return;const before=snapshot();state.first=i;record(state.players[i].name+' 获得先手'+(random?' · 随机判定':' · 手动选择'),before);renderTool();sound('heal');}
function historyPageSize(){const h=innerHeight;return h<=340?2:h<=390?3:h<=480?4:h<=650?5:8;}
function showHistory(page=0){const size=historyPageSize(),total=Math.max(1,Math.ceil(state.history.length/size));page=Math.max(0,Math.min(total-1,page));const start=page*size,visible=state.history.slice(start,start+size);openModal('决斗记录',`<p class="modal-sub history-intro">最新操作在最上方 · 保留最近 ${MAX_HISTORY} 条 · 撤销会恢复该操作前的状态。</p><div class="history-list">${visible.length?visible.map((h,i)=>`<div class="history-row"><span class="seq">${String(state.history.length-start-i).padStart(2,'0')}</span><span class="desc ${h.type==='damage'?'red-text':h.type==='heal'?'green-text':''}">${esc(h.text)}</span><time>${esc(h.time)}</time></div>`).join(''):'<div class="empty">尚无记录，开始你的决斗。</div>'}</div><div class="history-pager"><button id="historyPrev" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${total}</span><button id="historyNext" ${page===total-1?'disabled':''}>下一页</button></div><div class="history-actions"><button id="historyUndo" ${state.history.length?'':'disabled'}>撤销上一步</button><button id="exportHistory" ${state.history.length?'':'disabled'}>导出记录</button></div>`);$('#historyPrev').onclick=()=>showHistory(page-1);$('#historyNext').onclick=()=>showHistory(page+1);$('#historyUndo').onclick=()=>{undo();showHistory(page)};$('#exportHistory').onclick=exportHistory;}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function exportHistory(){const header=`游戏王对战计数器\n${new Date().toLocaleString('zh-CN')}\n${state.players.map(p=>p.name+'：'+p.lp+' LP').join(' / ')}\n\n`;download(new Blob(['\uFEFF'+header+state.history.slice().reverse().map(h=>h.time+'  '+h.text).join('\n')],{type:'text/plain;charset=utf-8'}),'决斗记录-'+new Date().toISOString().slice(0,10)+'.txt');toast('已生成记录文件');}
function settingsModal(){openModal('决斗设置',`<div class="settings-grid">${state.players.map((p,i)=>`<div><label for="settingName${i}">玩家${i+1}名称</label><input id="settingName${i}" maxlength="20" value="${esc(p.name)}"></div>`).join('')}<div class="full-grid"><label for="initialLP">新对战初始 LP</label><input id="initialLP" type="number" inputmode="numeric" min="1" max="999999" step="1" value="${state.initial}"></div></div><div class="history-actions"><button id="saveSettings">保存设置</button><button class="danger" id="newDuel">开始新对战</button></div><div class="help-text">使用：横屏显示双方 LP；快捷按钮支持扣减 / 回复；自定义可直接设定 LP。生命值减半向下取整。先手操作可撤销。<br>离线：文件包含全部资源，无需网络。请在手机浏览器中打开 HTML；文件预览器可能无法运行脚本。能否自动恢复上次对战取决于浏览器的本地存储支持。</div>`);function readSettings(){const initialText=$('#initialLP').value.trim(),initial=Number(initialText);if(!initialText||!Number.isInteger(initial)||initial<1||initial>LIMIT){toast('初始 LP 请输入 1 到 999999 的整数');$('#initialLP').focus();return null;}return{names:[0,1].map(i=>$('#settingName'+i).value.trim()||('玩家'+(i?'二':'一'))),initial,sound:state.sound};}function applySettings(s){state.players.forEach((p,i)=>{p.name=s.names[i]});state.initial=s.initial;state.sound=s.sound;}
$('#saveSettings').onclick=()=>{const s=readSettings();if(!s)return;applySettings(s);save();renderAll();closeModal();toast('设置已保存 · 初始 LP 在新对战时生效');};$('#newDuel').onclick=()=>{const s=readSettings();if(s)confirmReset(s,settingsModal);};}
function currentSettings(){return{names:state.players.map(p=>p.name),initial:state.initial,sound:state.sound};}
function confirmReset(s,onCancel){openModal('重置对战？',`<p class="modal-sub">双方生命值将重置为 ${s.initial} LP，先手和当前操作记录会清空。需要保留记录时，请先取消并导出。</p><div class="confirm-actions"><button id="cancelReset">取消</button><button class="danger" id="confirmReset">确认重置</button></div>`);$('#cancelReset').onclick=onCancel;$('#confirmReset').onclick=()=>{state=defaultState();state.initial=s.initial;state.sound=s.sound;state.players.forEach((p,i)=>{p.name=s.names[i];p.lp=s.initial});modes=[-1,-1];setMode(0,-1);setMode(1,-1);save();renderAll();closeModal();const flash=$('#flash');flash.classList.remove('animate');void flash.offsetWidth;flash.classList.add('animate');playDuelStartSound();};}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.mode!==undefined)setMode(Number(b.dataset.player),Number(b.dataset.mode));
  if(b.dataset.quick!==undefined){const i=Number(b.dataset.player),n=Number(b.dataset.quick);changeLP(i,state.players[i].lp+modes[i]*n,(modes[i]<0?'扣减 ':'回复 ')+n);}
  if(b.dataset.custom!==undefined)keypadModal(Number(b.dataset.custom));
  if(b.dataset.half!==undefined){const i=Number(b.dataset.half);changeLP(i,Math.floor(state.players[i].lp/2),'生命值减半');}
  if(b.dataset.tool)openTool(b.dataset.tool);
});
$('#undo').onclick=undo;$('#history').onclick=()=>showHistory(0);$('#settings').onclick=settingsModal;$('#reset').onclick=()=>confirmReset(currentSettings(),closeModal);
$('#soundToggle').onclick=()=>{state.sound=!state.sound;if(!state.sound)stopLifeSound();save();renderSoundToggle();if(state.sound)sound('heal');toast(state.sound?'决斗音效已开启':'决斗音效已关闭');};
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();try{await screen.orientation?.lock('landscape')}catch(e){}}else toast('此浏览器不支持网页全屏，请横过手机使用');}catch(e){toast('全屏暂不可用，请横过手机使用');}};
document.addEventListener('keydown',e=>{if(!$('#modal').open||!$('#amountValue')||e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();inputKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();inputKey('⌫')}else if(e.key==='Enter'){e.preventDefault();if(!$('#applyAmount').disabled)applyAmount()}});
renderAll();save();prepareLifeBuffers().catch(()=>{});
</script></body></html>
